name = "pin-code-buddy"
main = "src/worker.js"
compatibility_date = "2024-09-23"

# Static assets (the whole app is static HTML/CSS/JS).
# The Worker in src/worker.js serves these files and adds a couple
# of small headers on top (caching + security). Point Cloudflare's
# GitHub sync at this repo and it will pick this file up automatically.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"

[observability]
enabled = true
